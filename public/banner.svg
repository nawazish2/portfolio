    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="480" fill="url(#sky)"/>

  <!-- distant ridges -->
  <path d="M0 280 C180 220 320 250 480 210 C640 170 760 230 920 200 C1080 170 1240 230 1400 190 C1500 165 1560 175 1600 160 L1600 480 L0 480 Z" fill="url(#hill1)" opacity="0.35"/>
  <path d="M0 320 C200 260 360 300 540 270 C720 240 860 310 1040 280 C1220 250 1380 300 1600 250 L1600 480 L0 480 Z" fill="url(#hill2)" opacity="0.5"/>
  <path d="M0 370 C220 320 400 360 600 330 C820 295 980 370 1180 340 C1360 315 1480 350 1600 320 L1600 480 L0 480 Z" fill="url(#hill3)" opacity="0.75"/>

  <!-- soft tree silhouettes -->
  <g fill="#0f172a" opacity="0.55">
    <ellipse cx="140" cy="390" rx="48" ry="70"/>
    <ellipse cx="200" cy="400" rx="36" ry="55"/>
    <ellipse cx="320" cy="405" rx="42" ry="62"/>
    <ellipse cx="1280" cy="385" rx="55" ry="78"/>
    <ellipse cx="1360" cy="395" rx="40" ry="60"/>
    <ellipse cx="1460" cy="400" rx="50" ry="68"/>
    <ellipse cx="900" cy="410" rx="30" ry="48"/>
    <ellipse cx="960" cy="415" rx="24" ry="40"/>
  </g>

  <!-- waterfall strokes -->
  <g stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M780 200 C785 260 770 300 790 360"/>
    <path d="M800 190 C810 255 795 310 815 365"/>
    <path d="M820 205 C825 265 815 310 830 360"/>
